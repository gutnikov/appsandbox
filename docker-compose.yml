# Локальный Postgres для разработки и тестов.
# В production база живёт в Neon, сюда она не приезжает.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zerotomvp
      POSTGRES_PASSWORD: zerotomvp
      POSTGRES_DB: zerotomvp
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zerotomvp']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
